<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Yochi — Full-Stack Developer</title>
  <desc id="desc">Animated cyberpunk terminal header with scan lines, particles, a typing effect, and a blinking cursor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030611"/>
      <stop offset=".52" stop-color="#091126"/>
      <stop offset="1" stop-color="#050713"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#c77dff"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#ff4ecd"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#22d3ee" stroke-opacity=".08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="nameReveal">
      <rect x="0" y="0" width="0" height="90">
        <animate attributeName="width" values="0;530;530" keyTimes="0;.65;1" dur="4s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .mono{font-family:Consolas,'Courier New',monospace}
      .muted{fill:#7082a6}
      .pulse{animation:pulse 2.8s ease-in-out infinite}
      .cursor{animation:blink .8s step-end infinite}
      .scan{animation:scan 6s linear infinite}
      .particle{animation:float 4s ease-in-out infinite}
      @keyframes blink{50%{opacity:0}}
      @keyframes pulse{50%{opacity:.35}}
      @keyframes scan{from{transform:translateY(-30px)}to{transform:translateY(450px)}}
      @keyframes float{50%{transform:translateY(-9px);opacity:.35}}
      @media(prefers-reduced-motion:reduce){.pulse,.cursor,.scan,.particle{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <path d="M24 72V38a14 14 0 0 1 14-14h180M1176 72V38a14 14 0 0 0-14-14H982M24 348v34a14 14 0 0 0 14 14h180M1176 348v34a14 14 0 0 1-14 14H982" fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
  <path d="M245 24h710M245 396h710" stroke="#263559" stroke-dasharray="4 12"/>
  <g class="mono" font-size="13">
    <text x="48" y="55" fill="#7cff6b">● SYSTEM ONLINE</text>
    <text x="1000" y="55" class="muted">NODE: Y-01</text>
    <text x="48" y="382" class="muted">SECURE CHANNEL // PUBLIC PROFILE</text>
    <text x="1008" y="382" fill="#22d3ee">READY_</text>
  </g>
  <g opacity=".7">
    <circle class="particle" cx="133" cy="127" r="2" fill="#22d3ee"/>
    <circle class="particle" cx="1080" cy="130" r="3" fill="#ff4ecd" style="animation-delay:.8s"/>
    <circle class="particle" cx="1020" cy="304" r="2" fill="#c77dff" style="animation-delay:1.4s"/>
    <circle class="particle" cx="187" cy="315" r="2.5" fill="#7cff6b" style="animation-delay:2s"/>
  </g>
  <g class="mono">
    <text x="338" y="137" fill="#22d3ee" font-size="16" letter-spacing="5">INITIALIZING DEVELOPER PROFILE</text>
    <text x="337" y="229" fill="#c77dff" fill-opacity=".12" font-size="76" font-weight="700" letter-spacing="8">YOCHI</text>
    <g transform="translate(337 158)" clip-path="url(#nameReveal)">
      <text x="0" y="71" fill="url(#neon)" font-size="76" font-weight="700" letter-spacing="8" filter="url(#glow)">YOCHI</text>
    </g>
    <rect class="cursor" x="852" y="171" width="8" height="62" rx="2" fill="#7cff6b" filter="url(#glow)"/>
    <text x="382" y="276" fill="#d7e1f7" font-size="24" letter-spacing="6">FULL-STACK DEVELOPER</text>
    <text x="472" y="317" fill="#7082a6" font-size="14" letter-spacing="3">&lt; BUILD / LEARN / ITERATE /&gt;</text>
  </g>
  <g class="scan" opacity=".2">
    <rect x="25" y="0" width="1150" height="2" fill="#22d3ee" filter="url(#glow)"/>
    <rect x="25" y="5" width="1150" height="18" fill="url(#neon)" opacity=".12"/>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#4e638f" stroke-opacity=".6"/>
</svg>
