<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Yochi technology matrix</title>
  <desc id="desc">Cyberpunk status cards grouping the supplied technologies into Frontend, Backend, Database, DevOps, and Tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050813"/><stop offset=".55" stop-color="#0a1125"/><stop offset="1" stop-color="#060713"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#22d3ee" stroke-opacity=".055"/></pattern>
    <style>
      .mono{font-family:Consolas,'Courier New',monospace}
      .title{font-size:16px;font-weight:700;letter-spacing:3px}
      .tech{fill:#d7e1f7;font-size:17px}
      .meta{fill:#7082a6;font-size:11px;letter-spacing:2px}
      .live{animation:live 2.6s ease-in-out infinite}
      .flow{animation:flow 9s linear infinite}
      @keyframes live{50%{opacity:.25}}
      @keyframes flow{to{stroke-dashoffset:-120}}
      @media(prefers-reduced-motion:reduce){.live,.flow{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="650" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="650" rx="22" fill="url(#grid)"/>
  <g class="mono">
    <text x="50" y="50" fill="#7cff6b" font-size="13" letter-spacing="3">MATRIX ONLINE</text>
    <text x="935" y="50" fill="#7082a6" font-size="12">09 MODULES DETECTED</text>
    <path class="flow" d="M48 73h1104" stroke="#263559" stroke-dasharray="6 12"/>

    <g transform="translate(48 100)">
      <rect width="530" height="220" rx="14" fill="#080e1e" stroke="#c77dff" stroke-width="1.5"/>
      <path d="M0 44h530" stroke="#c77dff" stroke-opacity=".35"/>
      <circle class="live" cx="24" cy="22" r="5" fill="#c77dff" filter="url(#glow)"/>
      <text class="title" x="42" y="28" fill="#c77dff">FRONTEND // UI_LAYER</text>
      <text class="tech" x="28" y="85">01  TypeScript</text>
      <text class="tech" x="28" y="130">02  React</text>
      <text class="tech" x="28" y="175">03  Next.js</text>
      <text class="meta" x="365" y="198">SIGNAL: PRIMARY</text>
    </g>

    <g transform="translate(622 100)">
      <rect width="530" height="220" rx="14" fill="#080e1e" stroke="#22d3ee" stroke-width="1.5"/>
      <path d="M0 44h530" stroke="#22d3ee" stroke-opacity=".35"/>
      <circle class="live" cx="24" cy="22" r="5" fill="#22d3ee" filter="url(#glow)" style="animation-delay:.35s"/>
      <text class="title" x="42" y="28" fill="#22d3ee">BACKEND // SERVICE_LAYER</text>
      <text class="tech" x="28" y="85">04  Node.js</text>
      <text class="tech" x="28" y="130">05  Express</text>
      <text class="tech" x="28" y="175">06  TypeORM</text>
      <text class="meta" x="365" y="198">SIGNAL: PRIMARY</text>
    </g>

    <g transform="translate(48 352)">
      <rect width="338" height="220" rx="14" fill="#080e1e" stroke="#ff4ecd" stroke-width="1.5"/>
      <path d="M0 44h338" stroke="#ff4ecd" stroke-opacity=".35"/>
      <circle class="live" cx="24" cy="22" r="5" fill="#ff4ecd" filter="url(#glow)" style="animation-delay:.7s"/>
      <text class="title" x="42" y="28" fill="#ff4ecd">DATABASE</text>
      <text class="tech" x="28" y="92">07  PostgreSQL</text>
      <path d="M28 130h282" stroke="#263559"/>
      <text class="meta" x="28" y="166">DATA PERSISTENCE</text>
      <text class="meta" x="28" y="193">RELATIONAL CORE</text>
    </g>

    <g transform="translate(431 352)">
      <rect width="338" height="220" rx="14" fill="#080e1e" stroke="#7cff6b" stroke-width="1.5"/>
      <path d="M0 44h338" stroke="#7cff6b" stroke-opacity=".35"/>
      <circle class="live" cx="24" cy="22" r="5" fill="#7cff6b" filter="url(#glow)" style="animation-delay:1.05s"/>
      <text class="title" x="42" y="28" fill="#7cff6b">DEVOPS</text>
      <text class="tech" x="28" y="92">08  Docker</text>
      <path d="M28 130h282" stroke="#263559"/>
      <text class="meta" x="28" y="166">CONTAINER WORKFLOW</text>
      <text class="meta" x="28" y="193">REPRODUCIBLE BUILDS</text>
    </g>

    <g transform="translate(814 352)">
      <rect width="338" height="220" rx="14" fill="#080e1e" stroke="#f9e64f" stroke-width="1.5"/>
      <path d="M0 44h338" stroke="#f9e64f" stroke-opacity=".35"/>
      <circle class="live" cx="24" cy="22" r="5" fill="#f9e64f" filter="url(#glow)" style="animation-delay:1.4s"/>
      <text class="title" x="42" y="28" fill="#f9e64f">TOOLS</text>
      <text class="tech" x="28" y="92">09  Git</text>
      <path d="M28 130h282" stroke="#263559"/>
      <text class="meta" x="28" y="166">VERSION CONTROL</text>
      <text class="meta" x="28" y="193">COLLABORATION LINK</text>
    </g>
    <text x="48" y="622" class="meta">NO PROFICIENCY SCORES // DECLARED TOOLCHAIN LABELS ONLY</text>
  </g>
  <rect x="1" y="1" width="1198" height="648" rx="21" fill="none" stroke="#314268"/>
</svg>
